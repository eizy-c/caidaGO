<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaidaGO - Portal Oficial</title>
  <style>
    :root {
      --bg: #130f35;
      --card-bg: #1c164a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --yellow: #facc15;
      --border: #312a6d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: var(--yellow);
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      background: #0f172a;
      color: var(--accent);
      border: 1.5px solid var(--border);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: var(--border);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CaidaGO</h1>
    <p>El clásico juego de cartas La Caída venezolana en tu dispositivo móvil.</p>
    <div class="btn-group">
      <a class="btn" href="privacy.html">Política de Privacidad</a>
      <a class="btn" href="data-deletion.html">Instrucciones de Eliminación de Datos</a>
    </div>
  </div>
</body>
</html>
